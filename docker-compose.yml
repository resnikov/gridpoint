services:
  gridpoint:
    build: .
    image: gridpoint:latest
    container_name: gridpoint
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
