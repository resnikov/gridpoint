services:
  gridpoint:
    build: .
    image: gridpoint:latest
    container_name: gridpoint
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Optional: set your What3Words API key here to enable W3W lookups
      # Get a free key at https://developer.what3words.com
      - W3W_API_KEY=${W3W_API_KEY:-}
      # Optional: comma-separated origins allowed to call /api/w3w cross-origin.
      # Leave unset for same-origin only.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-30}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
